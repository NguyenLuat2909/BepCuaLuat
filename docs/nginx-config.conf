# Cấu hình Nginx Reverse Proxy cho BepCuaLuat
# Đặt tại: /etc/nginx/sites-available/bepcualuat
# Sau đó: sudo ln -s /etc/nginx/sites-available/bepcualuat /etc/nginx/sites-enabled/

# HTTP redirect sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bepcualuat.example.com;  # ⬅️ Thay bằng domain thực
    
    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect tất cả HTTP sang HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS (chính)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bepcualuat.example.com;  # ⬅️ Thay bằng domain thực

    client_max_body_size 10M;

    # ========== SSL Configuration ==========
    ssl_certificate /etc/letsencrypt/live/bepcualuat.example.com/fullchain.pem;  # ⬅️ Thay domain
    ssl_certificate_key /etc/letsencrypt/live/bepcualuat.example.com/privkey.pem;  # ⬅️ Thay domain

    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ========== Security Headers ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========== Logging ==========
    access_log /var/log/nginx/bepcualuat-access.log combined;
    error_log /var/log/nginx/bepcualuat-error.log warn;

    # ========== Reverse Proxy to App ==========
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Upgrade connections (WebSocket support)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ========== Static Files Caching ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== Health check endpoint ==========
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
